[package]
name = "minnow"
version = "0.1.0"
description = "A lightweight Windows workspace for oh-my-pi sessions"
authors = ["hanphanr1"]
edition = "2021"
license = "MIT"
repository = "https://github.com/hanphanr1/Minnow"

[lib]
name = "minnow_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
which = "8"
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
